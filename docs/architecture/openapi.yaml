      summary: Per-vehicle key pairing and telemetry sync status
      operationId: getIntegrationsTeslaVehicles
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeslaVehicleStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
