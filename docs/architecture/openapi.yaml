# FleetOS API contract (task 1.3). Hand-maintained until task 3.8 generates it from the zod schemas behind the route handlers; lint: npx @redocly/cli lint docs/architecture/openapi.yaml
openapi: 3.1.0
info:
  title: FleetOS API
  version: 1.0.0-draft
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: "Contract for FleetOS `/api/v1` (roadmap task 1.3). Conventions: docs/architecture/api.md. Every operation carries `x-fleetos-stability` (`stable` | `preview`). Preview operations return simulated data in demo orgs and `501 capability_unavailable` otherwise, never an empty `200` (ADR-0006)."
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: app.fleetos.example
security:
  - SupabaseSession: []
  - BearerJWT: []
tags:
  - name: Platform
    description: Platform operations.
  - name: Vehicles
    description: Vehicles operations.
  - name: Vehicles (preview)
    description: "Vehicles: placeholder operations for data sources not yet available (simulated in demo orgs, 501 otherwise)."
  - name: Rides & dispatch (preview)
    description: "Rides & dispatch: placeholder operations for data sources not yet available (simulated in demo orgs, 501 otherwise)."
  - name: Hubs
    description: Hubs operations.
  - name: Hubs (preview)
    description: "Hubs: placeholder operations for data sources not yet available (simulated in demo orgs, 501 otherwise)."
  - name: Exceptions
    description: Exceptions operations.
  - name: Service
    description: Service operations.
  - name: Vendors
    description: Vendors operations.
  - name: Vendors (preview)
    description: "Vendors: placeholder operations for data sources not yet available (simulated in demo orgs, 501 otherwise)."
  - name: Money
    description: Money operations.
  - name: KPIs
    description: KPIs operations.
  - name: Reports
    description: Reports operations.
  - name: Public
    description: Public operations.
  - name: Settings
    description: Settings operations.
  - name: Integrations
    description: Integrations operations.
  - name: Copilot
    description: Copilot operations.
paths:
  /capabilities:
    get:
      tags:
        - Platform
      summary: Capability state for the active org
      operationId: getCapabilities
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me:
    get:
      tags:
        - Platform
      summary: Current user, memberships and active org
      operationId: getMe
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /orgs:
    get:
      tags:
        - Platform
      summary: Orgs the user belongs to
      operationId: getOrgs
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /orgs/current:
    patch:
      tags:
        - Platform
      summary: Update org settings (owner/admin)
      operationId: patchOrgsCurrent
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUpdate"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles:
    get:
      tags:
        - Vehicles
      summary: List vehicles with live state and today metrics
      operationId: getVehicles
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VehicleStatus"
        - name: hub_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: soc_lt
          in: query
          required: false
          schema:
            type: number
        - name: soc_gte
          in: query
          required: false
          schema:
            type: number
        - name: profitability
          in: query
          required: false
          schema:
            type: string
            enum:
              - strong
              - monitor
              - review
        - name: issue
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search number, VIN or location
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - csv
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleListItem"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Vehicles
      summary: Add a vehicle manually (owner/admin)
      operationId: postVehicles
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreate"
      responses:
        "201":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}:
    get:
      tags:
        - Vehicles
      summary: Vehicle detail with live state
      operationId: getVehiclesBy_id
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags:
        - Vehicles
      summary: Update vehicle (number, home hub, cost allocations, lifecycle)
      operationId: patchVehiclesBy_id
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/telemetry:
    get:
      tags:
        - Vehicles
      summary: Time series for selected fields
      operationId: getVehiclesBy_idTelemetry
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fields
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum:
              - raw
              - 1m
              - 1h
              - 1d
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySeries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/status-events:
    get:
      tags:
        - Vehicles
      summary: Status history (timeline)
      operationId: getVehiclesBy_idStatusEvents
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatusEvent"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/alerts:
    get:
      tags:
        - Vehicles
      summary: Vehicle alerts
      operationId: getVehiclesBy_idAlerts
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleAlert"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/charging-sessions:
    get:
      tags:
        - Vehicles
      summary: Charging sessions with energy and cost
      operationId: getVehiclesBy_idChargingSessions
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargingSession"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/battery-health:
    get:
      tags:
        - Vehicles
      summary: Battery state of health history (Tesla specs)
      operationId: getVehiclesBy_idBatteryHealth
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatteryHealth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/actions/pull-from-service:
    post:
      tags:
        - Vehicles
      summary: Manual Maintenance hold
      operationId: postVehiclesBy_idActionsPullFromService
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin, ops
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/actions/return-to-service:
    post:
      tags:
        - Vehicles
      summary: Release holds / close blocking items; override needs owner/admin + reason
      operationId: postVehiclesBy_idActionsReturnToService
      x-fleetos-stability: stable
      x-fleetos-roles: "owner, admin, ops (override: owner, admin)"
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnToServiceBody"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/commands:
    get:
      tags:
        - Vehicles
      summary: Command log for the vehicle
      operationId: getVehiclesBy_idCommands
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Command"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Vehicles
      summary: Send a vehicle command (Phase 7; disabled by default)
      operationId: postVehiclesBy_idCommands
      x-fleetos-stability: stable
      x-fleetos-roles: owner, admin, ops (if enabled)
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "202":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /vehicles/{id}/earnings:
    get:
      tags:
        - Vehicles (preview)
      summary: Live platform earnings for a vehicle
      operationId: getVehiclesBy_idEarnings
      x-fleetos-stability: preview
      x-fleetos-capability: earnings
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Earnings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/CapabilityUnavailable"
  /vehicles/{id}/cabin-events:
    get:
      tags:
        - Vehicles (preview)
      summary: Cabin cleanliness events
      operationId: getVehiclesBy_idCabinEvents
      x-fleetos-stability: preview
      x-fleetos-capability: cabin_events
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          headers:
            X-FleetOS-Stability:
              $ref: "#/components/headers/Stability"
            X-FleetOS-Data-Source:
              $ref: "#/components/headers/DataSource"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
