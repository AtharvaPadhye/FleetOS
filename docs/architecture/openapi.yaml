  /copilot/chat:
    post:
      tags:
        - Copilot
      summary: Ask Copilot (server-sent events stream)
      operationId: postCopilotChat
      x-fleetos-stability: stable
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotRequest"
      responses:
        "200":
          description: "Server-sent events: `token`, `tool_call`, `citation`, `proposal`, `done`"
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    SupabaseSession:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: Supabase session cookie (browser)
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user JWT
  parameters:
    OrgHeader:
      name: X-FleetOS-Org
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Active org id; checked against memberships (never trusted alone). Foreign org → 404.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: "`field` ascending, `-field` descending"
    Period:
      name: period
      in: query
      schema:
        type: string
        examples:
          - today
          - mtd
          - last_30d
          - month:2026-08
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  headers:
    Stability:
      schema:
        type: string
        enum:
          - stable
          - preview
    DataSource:
      schema:
        type: string
        enum:
          - live
          - simulated
          - csv
          - inferred
          - static
          - manual
          - mixed
      description: Present when the response is built from substitute data
  responses:
    Unauthenticated:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (also for resources in other orgs)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limited; see RateLimit-* headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CapabilityUnavailable:
      description: Preview capability has no source for this org
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CapabilityUnavailable"
  schemas:
    Error:
      type: object
      required:
        - error
        - message
        - request_id
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - validation_failed
            - rate_limited
            - capability_unavailable
            - upstream_unavailable
            - internal
        message:
          type: string
        details:
          type: array
          items:
            type: object
        request_id:
          type: string
    CapabilityUnavailable:
      type: object
      required:
        - error
        - capability
        - message
      properties:
        error:
          type: string
          const: capability_unavailable
        capability:
          $ref: "#/components/schemas/CapabilityName"
        message:
          type: string
        docs:
          type: string
          format: uri
        request_id:
          type: string
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
        total:
          type: integer
        total_is_estimate:
          type: boolean
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
        lng:
          type: number
    CapabilityName:
      type: string
      enum:
        - tesla
        - rides
        - earnings
        - cabin_events
        - autonomy_events
        - dispatch
        - charger_telemetry
        - live_tariffs
        - vendor_tracking
    Capabilities:
      type: object
      required:
        - org_id
        - capabilities
      properties:
        org_id:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            type: object
            required:
              - name
              - state
            properties:
              name:
                $ref: "#/components/schemas/CapabilityName"
              state:
                type: string
                enum:
                  - live
                  - simulated
                  - unavailable
              source:
                oneOf:
                  - type: string
                  - type: "null"
              fallback:
                oneOf:
                  - type: string
                  - type: "null"
    Role:
      type: string
      enum:
        - owner
        - admin
        - ops
        - finance
        - viewer
    Org:
      type: object
      required:
        - id
        - name
        - timezone
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        currency:
          type: string
        region:
          type: string
          enum:
            - na
            - eu
            - cn
        is_demo:
          type: boolean
        availability_target:
          type: number
          minimum: 0
          maximum: 1
        low_soc_threshold:
          type: number
          minimum: 0
          maximum: 1
        service_start:
          type: string
        service_end:
          type: string
    OrgUpdate:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        availability_target:
          type: number
          minimum: 0
          maximum: 1
        low_soc_threshold:
          type: number
          minimum: 0
          maximum: 1
        service_start:
          type: string
        service_end:
          type: string
    Me:
      type: object
      required:
        - user_id
        - memberships
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          oneOf:
            - type: string
            - type: "null"
        active_org_id:
          type: string
          format: uuid
        memberships:
          type: array
          items:
            type: object
            properties:
              org:
                $ref: "#/components/schemas/Org"
              role:
                $ref: "#/components/schemas/Role"
        mfa_enabled:
          type: boolean
    VehicleStatus:
      type: string
      enum:
        - in_service
        - ready
        - charging
        - cleaning
        - maintenance
        - incident
        - offline
    VehicleState:
      type: object
      required:
        - status
        - connectivity
        - fresh
      properties:
        status:
          $ref: "#/components/schemas/VehicleStatus"
        status_since:
          type: string
          format: date-time
        soc:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        range_m:
          oneOf:
            - type: number
            - type: "null"
        charge_state:
          oneOf:
            - type: string
            - type: "null"
        charge_power_kw:
          oneOf:
            - type: number
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        location_name:
          oneOf:
            - type: string
            - type: "null"
        heading:
          oneOf:
            - type: number
            - type: "null"
        speed_mps:
          oneOf:
            - type: number
            - type: "null"
        odometer_m:
          oneOf:
            - type: number
            - type: "null"
        locked:
          oneOf:
            - type: boolean
            - type: "null"
        tpms:
          oneOf:
            - type: object
              properties:
                fl:
                  type: number
                fr:
                  type: number
                rl:
                  type: number
                rr:
                  type: number
            - type: "null"
        connectivity:
          type: string
          enum:
            - online
            - asleep
            - offline
        current_hub_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        last_telemetry_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        fresh:
          type: boolean
    VehicleListItem:
      type: object
      required:
        - id
        - number
        - vin
        - state
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        vin:
          type: string
        home_hub:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: "null"
        state:
          $ref: "#/components/schemas/VehicleState"
        today:
          type: object
          properties:
            revenue_cents:
              oneOf:
                - type: integer
                  description: Minor units (cents) in the org currency
                - type: "null"
            contribution_cents:
              oneOf:
                - type: integer
                  description: Minor units (cents) in the org currency
                - type: "null"
            revenue_per_available_hour_cents:
              oneOf:
                - type: integer
                  description: Minor units (cents) in the org currency
                - type: "null"
            downtime_min:
              type: integer
        open_issue:
          oneOf:
            - type: object
              properties:
                exception_id:
                  type: string
                  format: uuid
                type:
                  type: string
                severity:
                  $ref: "#/components/schemas/Severity"
            - type: "null"
        next_action:
          oneOf:
            - type: string
            - type: "null"
    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleListItem"
        - type: object
          properties:
            model:
              oneOf:
                - type: string
                - type: "null"
            lifecycle:
              type: string
              enum:
                - pending
                - commissioned
                - retired
            provider:
              type: string
              enum:
                - simulator
                - tesla
            commissioned_at:
              oneOf:
                - type: string
                  format: date-time
                - type: "null"
            insurance_monthly_cents:
              oneOf:
                - type: integer
                  description: Minor units (cents) in the org currency
                - type: "null"
            financing_monthly_cents:
              oneOf:
                - type: integer
                  description: Minor units (cents) in the org currency
                - type: "null"
            virtual_key_paired:
              oneOf:
                - type: boolean
                - type: "null"
            telemetry_synced:
              oneOf:
                - type: boolean
                - type: "null"
            holds:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  reason:
                    type: string
                  created_at:
                    type: string
                    format: date-time
    VehicleCreate:
      type: object
      required:
        - vin
        - number
      properties:
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
        number:
          type: string
        home_hub_id:
          type: string
          format: uuid
        insurance_monthly_cents:
          type: integer
          description: Minor units (cents) in the org currency
        financing_monthly_cents:
          type: integer
          description: Minor units (cents) in the org currency
    VehicleUpdate:
      type: object
      properties:
        number:
          type: string
        home_hub_id:
          type: string
          format: uuid
        lifecycle:
          type: string
          enum:
            - pending
            - commissioned
            - retired
        insurance_monthly_cents:
          type: integer
          description: Minor units (cents) in the org currency
        financing_monthly_cents:
          type: integer
          description: Minor units (cents) in the org currency
    TelemetrySeries:
      type: object
      required:
        - vehicle_id
        - series
      properties:
        vehicle_id:
          type: string
          format: uuid
        interval:
          type: string
        series:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              points:
                type: array
                items:
                  type: object
                  properties:
                    t:
                      type: string
                      format: date-time
                    v: {}
                    min:
                      type: number
                    max:
                      type: number
    StatusEvent:
      type: object
      required:
        - id
        - to_status
        - at
        - cause_type
      properties:
        id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        from_status:
          oneOf:
            - $ref: "#/components/schemas/VehicleStatus"
            - type: "null"
        to_status:
          $ref: "#/components/schemas/VehicleStatus"
        at:
          type: string
          format: date-time
        cause_type:
          type: string
          enum:
            - telemetry
            - ticket
            - exception
            - policy
            - manual
